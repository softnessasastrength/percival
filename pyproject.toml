[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percival-core"
version = "0.1.0"
description = "Local-first resource control and inference routing for Percival"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["percival*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
